project: 
  type: website

website: 
  page-navigation: true
  title: UG2 Github Landing Page 
  site-url: "https://ug2-gliders.github.io/UG2-Community-Lab-Manual/" 
  repo-url: "https://github.com/UG2-gliders/UG2-Community-Lab-Manual"
  repo-actions: [edit, source, issue]
  favicon: images/favicon.ico
  
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"
  
  sidebar:
    background: "#BDEDFF"
    logo: content/images/UG2_Option1_noBackground.png
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://underwatergliders.org/
        text: "Underwater Glider User Group"
      - icon: github
        href: https://github.com/UG2-gliders/UG2-Community-Lab-Manual
        text: "UG2 Community Lab Manual GitHub Repository"

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Home
      - href: content/best-practices.qmd
        text: "Best Practices"
      - href: content/software-tools.qmd
        text: "Software Tools"
      - section: content/gliders.qmd
        text: "Gliders"
        contents: 
          - content/slocum.qmd
          - content/seaglider.qmd
          - content/alseamar.qmd
      - section: content/sensors.qmd
        text: "Sensors"
        contents: 
          - content/ctd.qmd
          - content/pam.qmd


        
format:
  html:
    theme:
      light: [cosmo, theme.scss] 
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true


filters:
  - include-files.lua
  - quarto

  
